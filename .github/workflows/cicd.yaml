name: Build and push docker image.

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v2


    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

    - name: Recreate application.properties
      run: |
        mkdir -p src/main/resources
        echo "${{ secrets.APP_PROPERTIES }}" > src/main/resources/application.properties
#=============
    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2


    - name: Docker build 
      run: |
        docker build -t netflix_backend:latest .

    - name: Docker push
      run: |
        docker tag netflix_backend:latest 562590527112.dkr.ecr.eu-west-1.amazonaws.com/movie-backend:v${GITHUB_RUN_NUMBER}
        docker push 562590527112.dkr.ecr.eu-west-1.amazonaws.com/movie-backend:v${GITHUB_RUN_NUMBER}

